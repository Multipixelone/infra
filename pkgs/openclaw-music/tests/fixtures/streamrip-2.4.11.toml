[artist_filters]
extras = false
repeats = false
non_albums = false
features = false
non_remaster = false

[artwork]
embed = false
embed_size = "large"
embed_max_width = -1
save_artwork = false
saved_max_width = -1

[cli]
progress_bars = false
max_search_results = 100
no_update_check = true

[conversion]
enabled = false
codec = "ALAC"
sampling_rate = 48000
bit_depth = 24
lossy_bitrate = 320

[database]
downloads_enabled = true
downloads_path = ""
failed_downloads_enabled = true
failed_downloads_path = ""

[deezer]
quality = 2
lower_quality_if_not_available = true
arl = ""

[downloads]
folder = ""
source_subdirectories = false
disc_subdirectories = true
max_connections = 2
requests_per_minute = 30
verify_ssl = true
lyrics = false

[filepaths]
add_singles_to_folder = false
folder_format = "{albumartist} - {title} ({year}) [{container}] [{bit_depth}B-{sampling_rate}kHz]"
track_format = "{tracknumber:02}. {artist} - {title}{explicit}"
restrict_characters = false
truncate_to = 120

[lastfm]
source = "qobuz"
fallback_source = ""

[metadata]
set_playlist_to_album = true
renumber_playlist_tracks = true
exclude = []
prefer_explicit = false

[qobuz]
quality = 3
download_booklets = false
user_id = ""
auth_token = ""
app_id = ""
secrets = []

[soundcloud]
client_id = ""
app_version = ""

[spotify]
client_id = ""
redirect_uri = "http://127.0.0.1:9900/callback"
audio_format = "m4a"
audio_bitrate = 256
match_videos = false
access_token = ""
refresh_token = ""
token_expiry = ""

[tidal]
quality = 3
hires_client = false
client_id = ""
client_secret = ""
token_client_id = ""
hires_access_token = ""
hires_refresh_token = ""
hires_token_expiry = ""
hires_token_client_id = ""
user_id = ""
country_code = ""
access_token = ""
refresh_token = ""
token_expiry = ""
