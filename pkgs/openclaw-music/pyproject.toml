[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-music"
version = "0.1.0"
description = "Durable, narrow music acquisition job worker"
requires-python = ">=3.11"

[project.scripts]
openclaw-music = "openclaw_music.cli:main"

[tool.ruff]
target-version = "py311"

[tool.setuptools]
packages = ["openclaw_music"]
