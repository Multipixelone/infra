[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-embed-backfill"
version = "0.1.0"
description = "Read-only, resumable nightly beets embedding backfill"
requires-python = ">=3.11"

[project.scripts]
beets-embed-backfill-run = "beets_embed_backfill:main"

[tool.setuptools]
py-modules = ["beets_embed_backfill"]
